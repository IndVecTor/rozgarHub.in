<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Dashboard - RozgarHub.in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAfbDA-3Lh8VyUg2kirKV6kTgRiFj77gxc",
            authDomain: "rozgarhub-aa22b.firebaseapp.com",
            projectId: "rozgarhub-aa22b",
            storageBucket: "rozgarhub-aa22b.firebasestorage.app",
            messagingSenderId: "979487527584",
            appId: "1:979487527584:web:43b1f8eeb07c6631f42fc5"
        };
        const app = initializeApp(firebaseConfig);
        window.db = getFirestore(app);
        window.collection = collection;
        window.addDoc = addDoc;
        window.getDocs = getDocs;
    </script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <header class="bg-yellow-500 text-gray-900 shadow-lg p-4 font-bold flex justify-between items-center">
        <span>🏢 HR & Employer Hub</span>
        <a href="index.html" class="bg-white px-3 py-1.5 rounded-lg text-xs">&larr; होम पेज</a>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-3xl flex-grow space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-xl border space-y-4">
            <h2 class="text-lg font-black text-gray-900">📢 नई प्राइवेट जॉब पोस्ट करें (Post a Job)</h2>
            <form onsubmit="publishJob(event)" class="space-y-3 text-xs">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                    <input type="text" id="jTitle" placeholder="जॉब टाइटल (जैसे: Data Entry Operator)" required class="p-3 border rounded-xl">
                    <input type="text" id="jCompany" placeholder="कंपनी / दुकान का नाम" required class="p-3 border rounded-xl">
                </div>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                    <input type="text" id="jCity" placeholder="लोकेशन (जैसे: Azamgarh)" required class="p-3 border rounded-xl">
                    <input type="text" id="jSalary" placeholder="सैलरी (जैसे: ₹15,000/mo)" required class="p-3 border rounded-xl">
                    <select id="jCategory" class="p-3 border rounded-xl font-bold">
                        <option value="IT/Software">IT / Software</option>
                        <option value="BPO/Voice">BPO / Customer Care</option>
                        <option value="BackOffice">Back Office / Operations</option>
                        <option value="Sales/Retail">Sales & Retail</option>
                    </select>
                </div>
                <textarea id="jDesc" rows="3" placeholder="जॉब विवरण और योग्यता..." required class="w-full p-3 border rounded-xl"></textarea>
                <button type="submit" class="w-full bg-yellow-500 hover:bg-yellow-400 text-gray-900 py-3 rounded-xl font-black text-sm shadow">जॉब लाइव करें 🚀</button>
            </form>
        </div>
    </main>

    <footer class="bg-gray-900 text-white text-center py-4 text-xs">
        &copy; 2026 RozgarHub.in • Employer Portal
    </footer>

    <script>
        async function publishJob(e) {
            e.preventDefault();
            const jobData = {
                title: document.getElementById('jTitle').value,
                company: document.getElementById('jCompany').value,
                city: document.getElementById('jCity').value,
                salary: document.getElementById('jSalary').value,
                category: document.getElementById('jCategory').value,
                desc: document.getElementById('jDesc').value,
                createdAt: Date.now()
            };
            try {
                await window.addDoc(window.collection(window.db, "jobs"), jobData);
                alert("जॉब सफलतापूर्वक पब्लिश कर दी गई है!");
                e.target.reset();
            } catch(err) {
                alert("एरर: " + err.message);
            }
        }
    </script>
</body>
</html>
