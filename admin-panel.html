<!DOCTYPE html>
<html lang="hi" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Admin Panel - RozgarHub.in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', }</script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const app = initializeApp({
            apiKey: "AIzaSyAfbDA-3Lh8VyUg2kirKV6kTgRiFj77gxc",
            authDomain: "rozgarhub-aa22b.firebaseapp.com",
            projectId: "rozgarhub-aa22b",
            storageBucket: "rozgarhub-aa22b.firebasestorage.app",
            messagingSenderId: "979487527584",
            appId: "1:979487527584:web:43b1f8eeb07c6631f42fc5"
        });
        window.db = getFirestore(app);
        window.collection = collection;
        window.getDocs = getDocs;
        window.deleteDoc = deleteDoc;
        window.doc = doc;
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans flex flex-col min-h-screen">
    <header class="glass-card shadow-lg sticky top-0 z-50 border-b border-slate-200 dark:border-slate-800">
        <div class="container mx-auto flex justify-between items-center p-4">
            <a href="index.html" class="text-2xl font-black text-red-600">RozgarHub<span class="text-yellow-500">.in</span> | Super Admin</a>
            <div class="flex items-center space-x-3 text-sm font-bold">
                <button onclick="document.getElementById('htmlRoot').classList.toggle('dark')" class="p-2.5 rounded-2xl bg-slate-100 dark:bg-slate-900">🌙</button>
                <a href="index.html" class="px-4 py-2 rounded-2xl bg-slate-100 dark:bg-slate-900">🏠 होम</a>
                <button id="logoutBtn" onclick="localStorage.removeItem('rozgarHubAdminLoggedIn'); location.reload();" class="hidden px-4 py-2 rounded-2xl bg-red-600 text-white">लॉग आउट</button>
            </div>
        </div>
    </header>

    <main id="adminAuthView" class="container mx-auto px-4 py-16 flex-grow flex justify-center items-center max-w-md">
        <div class="glass-card p-8 rounded-[2.5rem] shadow-2xl border w-full space-y-6 text-center">
            <div class="w-16 h-16 mx-auto rounded-3xl bg-red-600 flex items-center justify-center text-3xl text-white font-black">🔐</div>
            <h1 class="text-2xl font-black">सुपर एडमिन लॉगिन</h1>
            <form onsubmit="if(document.getElementById('pInput').value === '2026') { localStorage.setItem('rozgarHubAdminLoggedIn', 'true'); alert('लॉगिन सफल!'); location.reload(); } else { alert('गलत पासवर्ड! (पासवर्ड 2026 है)'); } event.preventDefault();" class="space-y-4 text-xs text-left">
                <div><label class="font-bold">पासवर्ड (2026)</label><input type="password" id="pInput" required class="w-full border p-3.5 rounded-2xl bg-white/50 dark:bg-slate-900/50 font-bold"></div>
                <button type="submit" class="w-full py-4 rounded-2xl bg-red-600 text-white font-black shadow-lg">लॉगिन करें 🛡️</button>
            </form>
        </div>
    </main>

    <main id="adminDashboardView" class="container mx-auto px-4 py-10 max-w-6xl flex-grow hidden space-y-8">
        <div class="glass-card p-6 rounded-3xl shadow-lg border flex justify-between items-center">
            <div><p class="text-xs text-slate-500 font-bold uppercase">Total Live Jobs</p><h3 id="statTotalJobs" class="text-3xl font-black text-red-600 mt-1">0</h3></div>
            <span class="text-4xl">📢</span>
        </div>

        <div class="glass-card p-8 rounded-[2.5rem] shadow-xl border space-y-6">
            <h3 class="font-black text-base uppercase">📋 सभी जॉब्स का मॉडरेशन और डिलीट</h3>
            <div id="adminJobsContainer" class="space-y-3"><p class="text-xs text-slate-400">लोड हो रहा है...</p></div>
        </div>
    </main>

    <script>
        window.onload = () => {
            if(localStorage.getItem('rozgarHubAdminLoggedIn') === 'true') {
                document.getElementById('adminAuthView').classList.add('hidden');
                document.getElementById('adminDashboardView').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
            }
        };
        window.addEventListener('firebase-ready', () => {
            if(localStorage.getItem('rozgarHubAdminLoggedIn') === 'true') loadAdminJobs();
        });
        async function loadAdminJobs() {
            let snap = await window.getDocs(window.collection(window.db, "jobs"));
            let html = "", count = 0;
            snap.forEach(d => {
                count++; let j = d.data();
                html += `<div class="p-4 border rounded-2xl flex justify-between items-center text-xs bg-white/50 dark:bg-slate-900/50">
                    <div><b>${j.title}</b> • ${j.company} • 📍 ${j.city} • 💰 ${j.salary}</div>
                    <button onclick="deleteJob('${d.id}')" class="bg-red-100 text-red-700 px-4 py-2 rounded-xl font-bold">🗑️ हमेशा के लिए डिलीट</button>
                </div>`;
            });
            document.getElementById('statTotalJobs').innerText = count;
            document.getElementById('adminJobsContainer').innerHTML = html || "<p class='text-xs text-slate-400'>कोई जॉब नहीं है।</p>";
        }
        async function deleteJob(id) {
            if(confirm("क्या आप इस जॉब को हमेशा के लिए डिलीट करना चाहते हैं?")) {
                await window.deleteDoc(window.doc(window.db, "jobs", id));
                alert("जॉब डिलीट हो गई है!");
                loadAdminJobs();
            }
        }
    </script>
</body>
</html>
