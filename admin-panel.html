<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - RozgarHub.in</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans min-h-screen flex flex-col justify-between">

    <!-- Navbar -->
    <header class="bg-red-700 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center p-4">
            <div class="flex items-center space-x-2">
                <span class="text-xl">🛠️</span>
                <span class="text-xl font-black tracking-wide">RozgarHub Admin Panel</span>
            </div>
            <a href="index.html" class="bg-white text-red-700 px-4 py-2 rounded-lg text-xs font-bold hover:bg-gray-100 transition shadow">&larr; लाइव साइट पर जाएं</a>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="container mx-auto px-4 py-8 max-w-4xl flex-grow space-y-8">
        
        <!-- Post New Job / Syllabus / Vacancy Card -->
        <div class="bg-white p-6 md:p-8 rounded-2xl shadow-xl border-t-4 border-red-600 space-y-6">
            <div>
                <h2 class="text-xl font-black text-gray-900">📢 नई वैकेंसी, रिजल्ट या बाइलिंगुअल सिलेबस पब्लिश करें</h2>
                <p class="text-xs text-gray-500 mt-0.5">यहाँ जो जानकारी भरेंगे, वह तुरंत होम पेज पर लाइव हो जाएगी।</p>
            </div>

            <form id="adminPostForm" onsubmit="handleAdminPublish(event)" class="space-y-4 text-xs md:text-sm">
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold mb-1 text-gray-700">शीर्षक (Title)</label>
                        <input type="text" id="pTitle" placeholder="जैसे: SSC CHSL Syllabus 2026 PDF" required class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-red-500">
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-gray-700">श्रेणी चुनें (Category)</label>
                        <select id="pCategory" onchange="toggleSyllabusFields()" class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-red-500 bg-white font-semibold">
                            <option value="Sarkari">🏛️ Latest Sarkari Vacancy</option>
                            <option value="Private">🏢 Direct Private Job</option>
                            <option value="AdmitCard">🖨️ Admit Card</option>
                            <option value="Result">🏆 Result</option>
                            <option value="Syllabus">📚 Exam Syllabus (Bilingual PDFs)</option>
                            <option value="AnswerKey">📝 Answer Key</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block font-bold mb-1 text-gray-700">संस्थान / बोर्ड (Organization)</label>
                        <input type="text" id="pOrg" placeholder="जैसे: UPSC / SSC" required class="w-full border p-2.5 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-gray-700">लोकेशन / स्तर (Location / Level)</label>
                        <input type="text" id="pCity" placeholder="जैसे: All India" required class="w-full border p-2.5 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-gray-700">अंतिम तिथि / स्टेटस (Date / Status)</label>
                        <input type="text" id="pDate" placeholder="जैसे: Active" required class="w-full border p-2.5 rounded-lg">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block font-bold mb-1 text-gray-700">वेतन / परीक्षा पैटर्न (Salary / Exam Pattern)</label>
                        <input type="text" id="pSalary" placeholder="जैसे: Tier-1 Exam या ₹45,000/mo" class="w-full border p-2.5 rounded-lg">
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-gray-700">आधिकारिक लिंक (Official Notice Link)</label>
                        <input type="url" id="pLink" placeholder="https://..." class="w-full border p-2.5 rounded-lg">
                    </div>
                </div>

                <!-- Conditional PDF Links for Syllabus / Answer Key -->
                <div id="pdfFields" class="hidden grid grid-cols-1 md:grid-cols-2 gap-4 bg-amber-50 p-4 rounded-xl border border-amber-200">
                    <div>
                        <label class="block font-bold mb-1 text-amber-900">📥 हिंदी पीडीएफ लिंक (Hindi PDF URL)</label>
                        <input type="url" id="pHindiPdf" placeholder="https://... (असली हिंदी पीडीएफ लिंक)" class="w-full border p-2.5 rounded-lg bg-white">
                    </div>
                    <div>
                        <label class="block font-bold mb-1 text-amber-900">📥 अंग्रेजी पीडीएफ लिंक (English PDF URL)</label>
                        <input type="url" id="pEnglishPdf" placeholder="https://... (असली अंग्रेजी पीडीएफ लिंक)" class="w-full border p-2.5 rounded-lg bg-white">
                    </div>
                </div>

                <div>
                    <label class="block font-bold mb-1 text-gray-700">विस्तृत विवरण और योग्यता (Full Description)</label>
                    <textarea id="pDesc" rows="4" placeholder="योग्यता, परीक्षा के विषय और अन्य विवरण यहाँ लिखें..." required class="w-full border p-2.5 rounded-lg focus:ring-2 focus:ring-red-500"></textarea>
                </div>

                <button type="submit" class="w-full bg-red-600 text-white py-3 rounded-xl font-black text-sm hover:bg-red-700 transition shadow-lg">🚀 तुरंत पब्लिश करें (Publish Live)</button>
            </form>
        </div>

        <!-- Managed Posts List -->
        <div class="bg-white p-6 rounded-2xl shadow-xl border space-y-4">
            <h3 class="font-black text-base text-gray-900 border-b pb-2 flex justify-between items-center">
                <span>📋 आपके द्वारा पब्लिश की गई पोस्ट्स (Manage Posts)</span>
                <button onclick="clearAllAdminPosts()" class="text-xs bg-gray-100 text-red-600 px-3 py-1.5 rounded-lg font-bold hover:bg-red-50">सभी डिलीट करें</button>
            </h3>
            <div id="adminPostsList" class="space-y-3 max-h-[350px] overflow-y-auto">
                <!-- Dynamically loaded -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white text-center py-4 text-xs mt-12">
        &copy; 2026 RozgarHub.in • Secure Admin Panel
    </footer>

    <!-- Script -->
    <script>
        window.onload = function() {
            renderAdminPosts();
            toggleSyllabusFields();
        };

        function toggleSyllabusFields() {
            const cat = document.getElementById('pCategory').value;
            const pdfBox = document.getElementById('pdfFields');
            if(cat === 'Syllabus' || cat === 'AnswerKey') {
                pdfBox.classList.remove('hidden');
            } else {
                pdfBox.classList.add('hidden');
            }
        }

        function handleAdminPublish(e) {
            e.preventDefault();
            const title = document.getElementById('pTitle').value.trim();
            const category = document.getElementById('pCategory').value;
            const org = document.getElementById('pOrg').value.trim();
            const city = document.getElementById('pCity').value.trim();
            const date = document.getElementById('pDate').value.trim();
            const salary = document.getElementById('pSalary').value.trim();
            const link = document.getElementById('pLink').value.trim();
            const desc = document.getElementById('pDesc').value.trim();
            const hindiPdf = document.getElementById('pHindiPdf').value.trim();
            const englishPdf = document.getElementById('pEnglishPdf').value.trim();

            const newPost = {
                id: Date.now(),
                title,
                category,
                type: category,
                org,
                state: city,
                city,
                date,
                salary,
                link,
                desc,
                hindiPdf,
                englishPdf,
                qualification: "Graduate"
            };

            let posts = JSON.parse(localStorage.getItem('rozgarHubAdminPosts')) || [];
            posts.unshift(newPost);
            localStorage.setItem('rozgarHubAdminPosts', JSON.stringify(posts));

            alert("सफलतापूर्वक पब्लिश कर दिया गया है!");
            document.getElementById('adminPostForm').reset();
            toggleSyllabusFields();
            renderAdminPosts();
        }

        function renderAdminPosts() {
            const container = document.getElementById('adminPostsList');
            let posts = JSON.parse(localStorage.getItem('rozgarHubAdminPosts')) || [];

            if (posts.length === 0) {
                container.innerHTML = `<p class="text-xs text-gray-500 italic">अभी कोई नई पोस्ट पब्लिश नहीं की गई है।</p>`;
                return;
            }

            let html = "";
            posts.forEach(post => {
                html += `
                    <div class="p-3 border rounded-xl flex justify-between items-center text-xs bg-gray-50">
                        <div>
                            <span class="font-bold text-red-600 uppercase text-[10px] bg-red-50 px-2 py-0.5 rounded border border-red-200">${post.category}</span>
                            <h4 class="font-bold text-gray-900 mt-1">${post.title}</h4>
                            <p class="text-gray-500">${post.org} • 📍 ${post.city} | 📅 ${post.date}</p>
                        </div>
                        <button onclick="deletePost(${post.id})" class="bg-red-100 text-red-700 px-3 py-1.5 rounded-lg font-bold hover:bg-red-200 transition shrink-0">डिलीट</button>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function deletePost(id) {
            let posts = JSON.parse(localStorage.getItem('rozgarHubAdminPosts')) || [];
            posts = posts.filter(p => p.id !== id);
            localStorage.setItem('rozgarHubAdminPosts', JSON.stringify(posts));
            renderAdminPosts();
        }

        function clearAllAdminPosts() {
            if(confirm("क्या आप वाकई सभी पब्लिश की गई पोस्ट्स डिलीट करना चाहते हैं?")) {
                localStorage.removeItem('rozgarHubAdminPosts');
                renderAdminPosts();
            }
        }
    </script>
</body>
</html>
