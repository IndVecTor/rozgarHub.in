<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15+ Unique Colorful Resume Builder - RozgarHub.in</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans">

    <!-- Navbar -->
    <header class="bg-blue-600 text-white shadow-lg sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center p-4">
            <a href="index.html" class="text-2xl font-bold tracking-wide">RozgarHub<span class="text-yellow-300">.in</span></a>
            <a href="index.html" class="bg-white text-blue-600 px-4 py-2 rounded-lg text-sm font-bold hover:bg-gray-100 transition shadow">&larr; होम पेज</a>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="container mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-2 gap-8">
        
        <!-- Left Side: Form Inputs (All Optional) -->
        <div class="bg-white p-6 rounded-2xl shadow-md space-y-5 max-h-[90vh] overflow-y-auto">
            <h1 class="text-xl font-extrabold text-blue-700 border-b pb-2">📄 15+ Unique Colorful Resume Builder</h1>
            <p class="text-xs text-gray-500">All fields optional. Select from 15 distinct professional layouts.</p>

            <!-- 15 Unique Template Selector -->
            <div>
                <label class="block font-bold text-xs mb-1 text-gray-700">🎨 Choose Unique Colorful Template (1 to 15)</label>
                <select id="templateSelect" onchange="updateLivePreview()" class="w-full border p-2.5 rounded-lg text-sm bg-blue-50 font-semibold focus:ring-2 focus:ring-blue-500 text-blue-900">
                    <option value="1">1. Modern Indigo Sidebar (Deep Blue Theme)</option>
                    <option value="2">2. Vibrant Emerald Banner (Green Gradient)</option>
                    <option value="3">3. Sunset Orange Modern Card (Warm Tone)</option>
                    <option value="4">4. Cyberpunk Cyan Tech (Dark Slate & Cyan)</option>
                    <option value="5">5. Royal Blue Executive (Classic Corporate)</option>
                    <option value="6">6. Ruby Red Creative Split (Bold Red Theme)</option>
                    <option value="7">7. Minimalist Gold & Clean (Subtle Luxury)</option>
                    <option value="8">8. Creative Purple Grid (Vibrant Violet)</option>
                    <option value="9">9. Turquoise Teal Professional (Fresh Teal)</option>
                    <option value="10">10. Rose Pink Modern Style (Soft Rose Accent)</option>
                    <option value="11">11. Charcoal Amber Warmth (Dark & Gold)</option>
                    <option value="12">12. Neon Violet Futuristic (Sleek Gradient Style)</option>
                    <option value="13">13. Mint Green Fresh Cards (Rounded Soft Theme)</option>
                    <option value="14">14. Sunset Coral Vibrant (Coral & Pink Vibe)</option>
                    <option value="15">15. Classic Slate Grid (Multi-Box Professional)</option>
                </select>
            </div>

            <!-- Professional Photo Upload -->
            <div>
                <label class="block font-bold text-xs mb-1 text-gray-700">📷 Upload Passport Size Photo</label>
                <input type="file" id="resPhotoInput" accept="image/*" onchange="loadPhoto(event)" class="w-full text-xs border p-2 rounded-lg bg-gray-50">
            </div>

            <!-- Personal Details -->
            <div class="bg-gray-50 p-4 rounded-xl border space-y-3">
                <h3 class="font-bold text-xs uppercase text-blue-800">1. Personal Information</h3>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-xs mb-1">Full Name</label>
                        <input type="text" id="resName" oninput="updateLivePreview()" placeholder="e.g. Aman Kumar" class="w-full border p-2 rounded-lg text-sm bg-white">
                    </div>
                    <div>
                        <label class="block font-semibold text-xs mb-1">Mobile Number</label>
                        <input type="text" id="resPhone" oninput="updateLivePreview()" placeholder="+91 9876543210" class="w-full border p-2 rounded-lg text-sm bg-white">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-xs mb-1">Email Address</label>
                        <input type="email" id="resEmail" oninput="updateLivePreview()" placeholder="your.email@gmail.com" class="w-full border p-2 rounded-lg text-sm bg-white">
                    </div>
                    <div>
                        <label class="block font-semibold text-xs mb-1">Location / City</label>
                        <input type="text" id="resLocation" oninput="updateLivePreview()" placeholder="Azamgarh, Uttar Pradesh" class="w-full border p-2 rounded-lg text-sm bg-white">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block font-semibold text-xs mb-1">Date of Birth (DOB)</label>
                        <input type="text" id="resDob" oninput="updateLivePreview()" placeholder="DD/MM/YYYY" class="w-full border p-2 rounded-lg text-sm bg-white">
                    </div>
                    <div>
                        <label class="block font-semibold text-xs mb-1">Father's Name</label>
                        <input type="text" id="resFather" oninput="updateLivePreview()" placeholder="Mr. ..." class="w-full border p-2 rounded-lg text-sm bg-white">
                    </div>
                </div>
                <div>
                    <label class="block font-semibold text-xs mb-1">Mother's Name</label>
                    <input type="text" id="resMother" oninput="updateLivePreview()" placeholder="Mrs. ..." class="w-full border p-2 rounded-lg text-sm bg-white">
                </div>
            </div>

            <!-- Educational Details -->
            <div class="bg-gray-50 p-4 rounded-xl border space-y-3">
                <div class="flex justify-between items-center">
                    <h3 class="font-bold text-xs uppercase text-blue-800">2. Educational Qualifications</h3>
                    <button type="button" onclick="addEducationField()" class="bg-blue-600 text-white px-2.5 py-1 rounded text-xs font-bold hover:bg-blue-700 transition">+ Add Education</button>
                </div>
                <div id="educationContainer" class="space-y-3"></div>
            </div>

            <!-- Languages Known -->
            <div class="bg-gray-50 p-4 rounded-xl border space-y-3">
                <h3 class="font-bold text-xs uppercase text-blue-800">3. Languages Known</h3>
                <div class="flex gap-2">
                    <input type="text" id="langInput" placeholder="Add language (e.g. English, Hindi)..." class="w-full border p-2 rounded-lg text-sm bg-white">
                    <button type="button" onclick="addLanguage()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-xs font-bold hover:bg-green-700 transition">+</button>
                </div>
                <div id="languagesListDisplay" class="flex flex-wrap gap-2 pt-1"></div>
            </div>

            <!-- Professional Summary with Rotating AI Button -->
            <div class="bg-blue-50 p-4 rounded-xl border border-blue-200 space-y-2">
                <div class="flex justify-between items-center">
                    <label class="block font-bold text-xs text-blue-900 uppercase">4. Professional Summary</label>
                    <button type="button" onclick="generateAiSummary()" class="bg-blue-600 text-white px-3 py-1 rounded-lg text-xs font-bold hover:bg-blue-700 transition shadow">✨ Generate AI Summary (New)</button>
                </div>
                <textarea id="resSummaryInput" rows="3" oninput="updateLivePreview()" class="w-full border p-2.5 rounded-lg text-sm bg-white" placeholder="Type manually or click 'Generate AI Summary' for professional English summary..."></textarea>
            </div>

            <!-- Skills & Experience -->
            <div class="space-y-3">
                <div>
                    <label class="block font-semibold text-xs mb-1">5. Technical & Soft Skills</label>
                    <input type="text" id="resSkills" oninput="updateLivePreview()" placeholder="Basic Excel, MS Office, Typing, Communication" class="w-full border p-2 rounded-lg text-sm">
                </div>
                <div>
                    <label class="block font-semibold text-xs mb-1">6. Work Experience</label>
                    <textarea id="resExperience" rows="3" oninput="updateLivePreview()" placeholder="Computer Operator (8 Years) & Customer Support (3 Months at Concentrix)" class="w-full border p-2 rounded-lg text-sm"></textarea>
                </div>
            </div>

            <button onclick="window.print()" class="w-full bg-green-600 text-white py-3 rounded-xl font-bold hover:bg-green-700 transition shadow text-sm">🖨️ Print / Save as PDF</button>
        </div>

        <!-- Right Side: Real-time Dynamic Live Preview Box -->
        <div class="bg-white p-6 rounded-2xl shadow-xl border sticky top-24 h-fit" id="previewArea"></div>

    </main>

    <!-- JavaScript -->
    <script>
        let uploadedPhotoSrc = "";
        let educationList = [
            { degree: "High School (10th)", board: "UP Board", year: "2015" },
            { degree: "Intermediate (12th)", board: "UP Board", year: "2017" }
        ];
        let languagesList = ["English", "Hindi"];

        const aiSummariesList = [
            "Experienced Computer Operator with over 8 years of dedicated work history in administrative tasks, efficient data management, MS Office, and dual-language typing (English & Hindi).",
            "Customer Support Executive with proven experience at Concentrix, specializing in resolving customer queries, chat support, and maintaining high client satisfaction.",
            "Detail-oriented professional skilled in office automation, accurate record-keeping, database maintenance, and fast document processing.",
            "Dedicated administrative professional with a strong track record of supporting team workflows, managing correspondence, and ensuring high accuracy in daily operations."
        ];
        let aiSummaryIndex = 0;

        window.onload = function() {
            renderEducationInputs();
            renderLanguageTags();
            updateLivePreview();
        };

        function renderEducationInputs() {
            const container = document.getElementById('educationContainer');
            container.innerHTML = "";
            educationList.forEach((edu, index) => {
                container.innerHTML += `
                    <div class="flex gap-2 items-center bg-white p-2.5 rounded-lg border">
                        <input type="text" value="${edu.degree}" oninput="updateEdu(${index}, 'degree', this.value)" placeholder="Degree/Course" class="w-1/3 border p-1.5 rounded text-xs">
                        <input type="text" value="${edu.board}" oninput="updateEdu(${index}, 'board', this.value)" placeholder="Institution/Board" class="w-1/3 border p-1.5 rounded text-xs">
                        <input type="text" value="${edu.year}" oninput="updateEdu(${index}, 'year', this.value)" placeholder="Year" class="w-1/4 border p-1.5 rounded text-xs">
                        <button type="button" onclick="removeEdu(${index})" class="text-red-600 font-bold px-2 hover:bg-red-50 rounded">×</button>
                    </div>
                `;
            });
            updateLivePreview();
        }

        function addEducationField() {
            educationList.push({ degree: "", board: "", year: "" });
            renderEducationInputs();
        }

        function updateEdu(index, field, value) {
            educationList[index][field] = value;
            updateLivePreview();
        }

        function removeEdu(index) {
            educationList.splice(index, 1);
            renderEducationInputs();
        }

        function addLanguage() {
            const input = document.getElementById('langInput');
            const val = input.value.trim();
            if(val && !languagesList.includes(val)) {
                languagesList.push(val);
                input.value = "";
                renderLanguageTags();
            }
        }

        function removeLanguage(index) {
            languagesList.splice(index, 1);
            renderLanguageTags();
        }

        function renderLanguageTags() {
            const disp = document.getElementById('languagesListDisplay');
            disp.innerHTML = "";
            languagesList.forEach((lang, idx) => {
                disp.innerHTML += `
                    <span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-semibold flex items-center gap-1">
                        ${lang} <button type="button" onclick="removeLanguage(${idx})" class="text-red-500 font-bold ml-1 hover:text-red-700">&times;</button>
                    </span>
                `;
            });
            updateLivePreview();
        }

        function generateAiSummary() {
            const summaryBox = document.getElementById('resSummaryInput');
            summaryBox.value = aiSummariesList[aiSummaryIndex];
            aiSummaryIndex = (aiSummaryIndex + 1) % aiSummariesList.length;
            updateLivePreview();
        }

        function loadPhoto(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedPhotoSrc = e.target.result;
                    updateLivePreview();
                }
                reader.readAsDataURL(file);
            }
        }

        function updateLivePreview() {
            const name = document.getElementById('resName').value || "Your Name";
            const phone = document.getElementById('resPhone').value;
            const email = document.getElementById('resEmail').value;
            const location = document.getElementById('resLocation').value;
            const dob = document.getElementById('resDob').value;
            const father = document.getElementById('resFather').value;
            const mother = document.getElementById('resMother').value;
            
            const summary = document.getElementById('resSummaryInput').value;
            const skills = document.getElementById('resSkills').value;
            const exp = document.getElementById('resExperience').value;
            const template = document.getElementById('templateSelect').value;

            const previewArea = document.getElementById('previewArea');
            
            let photoHTML = uploadedPhotoSrc ? 
                `<img src="${uploadedPhotoSrc}" class="w-full h-full object-cover">` : 
                `<div class="flex flex-col items-center justify-center text-gray-400 text-xs font-semibold">Photo</div>`;

            let eduHTML = "";
            educationList.forEach(e => {
                if(e.degree || e.board || e.year) {
                    eduHTML += `<p class="text-[11px] text-gray-700">• <strong>${e.degree || ''}</strong> ${e.board ? '- ' + e.board : ''} ${e.year ? '(' + e.year + ')' : ''}</p>`;
                }
            });

            let langHTML = languagesList.join(", ");
            let contactLine = [email, phone, location].filter(Boolean).join(' | ');
            let personalLine = [dob ? 'DOB: ' + dob : '', father ? 'Father: ' + father : '', mother ? 'Mother: ' + mother : ''].filter(Boolean).join(' | ');

            // 15 Distinct Unique Colorful Layouts
            if (template === '1') {
                // 1. Modern Indigo Sidebar
                previewArea.innerHTML = `
                    <div class="grid grid-cols-3 gap-4 min-h-[550px]">
                        <div class="col-span-1 bg-indigo-900 text-white p-4 rounded-xl flex flex-col items-center text-center space-y-3 shadow-md">
                            <div class="w-28 h-28 rounded-full overflow-hidden bg-indigo-800 flex items-center justify-center shadow">${photoHTML}</div>
                            <div class="text-[11px] space-y-1.5 w-full text-left pt-2 border-t border-indigo-800">
                                <p class="font-bold underline text-center text-yellow-300">Contact</p>
                                ${email ? `<p class="break-all">📧 ${email}</p>` : ''}
                                ${phone ? `<p>📞 ${phone}</p>` : ''}
                                ${location ? `<p>📍 ${location}</p>` : ''}
                            </div>
                            <div class="text-[11px] space-y-1.5 w-full text-left pt-2 border-t border-indigo-800">
                                <p class="font-bold underline text-center text-yellow-300">Personal Info</p>
                                ${dob ? `<p>📅 DOB: ${dob}</p>` : ''}
                                ${father ? `<p>👨‍👦 Father: ${father}</p>` : ''}
                                ${mother ? `<p>👩‍👦 Mother: ${mother}</p>` : ''}
                            </div>
                            ${langHTML ? `<div class="text-[11px] space-y-1 w-full text-left pt-2 border-t border-indigo-800"><p class="font-bold underline text-center text-yellow-300">Languages</p><p class="text-center">${langHTML}</p></div>` : ''}
                            ${skills ? `<div class="text-[11px] space-y-1 w-full text-left pt-2 border-t border-indigo-800"><p class="font-bold underline text-center text-yellow-300">Skills</p><p>${skills}</p></div>` : ''}
                        </div>
                        <div class="col-span-2 space-y-3 p-2">
                            <div><h2 class="text-2xl font-extrabold text-indigo-900">${name}</h2></div>
                            ${summary ? `<div><h3 class="text-xs font-bold uppercase text-indigo-900 border-b border-indigo-900 pb-1 mb-1">Professional Summary</h3><p class="text-[11px] text-gray-700 leading-relaxed">${summary}</p></div>` : ''}
                            ${eduHTML ? `<div><h3 class="text-xs font-bold uppercase text-indigo-900 border-b border-indigo-900 pb-1 mb-1">Educational Qualifications</h3>${eduHTML}</div>` : ''}
                            ${exp ? `<div><h3 class="text-xs font-bold uppercase text-indigo-900 border-b border-indigo-900 pb-1 mb-1">Work Experience</h3><p class="text-[11px] text-gray-700 whitespace-pre-line leading-relaxed">${exp}</p></div>` : ''}
                        </div>
                    </div>`;
            } else if (template === '2') {
                // 2. Vibrant Emerald Banner
                previewArea.innerHTML = `
                    <div class="space-y-4">
                        <div class="bg-gradient-to-r from-emerald-700 to-teal-600 text-white p-4 rounded-xl flex items-center space-x-4 shadow-md">
                            <div class="w-24 h-24 rounded-xl overflow-hidden bg-emerald-900 flex items-center justify-center border-2 border-white">${photoHTML}</div>
                            <div><h2 class="text-2xl font-black">${name}</h2><p class="text-xs text-emerald-100">${contactLine}</p><p class="text-[10px] text-emerald-200 mt-1">${personalLine}</p></div>
                        </div>
                        <div class="space-y-3 px-2">
                            ${summary ? `<div><h3 class="text-xs font-bold uppercase text-emerald-800 border-b border-emerald-600 pb-1 mb-1">Summary</h3><p class="text-xs text-gray-700">${summary}</p></div>` : ''}
                            ${eduHTML ? `<div><h3 class="text-xs font-bold uppercase text-emerald-800 border-b border-emerald-600 pb-1 mb-1">Education</h3>${eduHTML}</div>` : ''}
                            ${skills ? `<div><h3 class="text-xs font-bold uppercase text-emerald-800 border-b border-emerald-600 pb-1 mb-1">Skills & Languages</h3><p class="text-xs text-gray-700">${skills} | ${langHTML}</p></div>` : ''}
                            ${exp ? `<div><h3 class="text-xs font-bold uppercase text-emerald-800 border-b border-emerald-600 pb-1 mb-1">Experience</h3><p class="text-xs text-gray-700 whitespace-pre-line">${exp}</p></div>` : ''}
                        </div>
                    </div>`;
            } else if (template === '3') {
                // 3. Sunset Orange Modern Card
                previewArea.innerHTML = `
                    <div class="space-y-4 border-2 border-orange-500 p-4 rounded-2xl bg-orange-50/20 shadow-sm">
                        <div class="flex items-center space-x-4 border-b border-orange-400 pb-3">
                            <div class="w-20 h-20 rounded-full overflow-hidden bg-white shadow flex items-center justify-center border-2 border-orange-500">${photoHTML}</div>
                            <div><h2 class="text-xl font-bold text-orange-900">${name}</h2><p class="text-xs text-gray-600">${contactLine}</p><p class="text-[10px] text-gray-500">${personalLine}</p></div>
                        </div>
                        <div class="space-y-3">
                            ${summary ? `<div><h3 class="text-xs font-bold uppercase text-orange-800 border-b border-orange-300 pb-1 mb-1">Profile Summary</h3><p class="text-xs text-gray-700">${summary}</p></div>` : ''}
                            ${eduHTML ? `<div><h3 class="text-xs font-bold uppercase text-orange-800 border-b border-orange-300 pb-1 mb-1">Education</h3>${eduHTML}</div>` : ''}
                            ${skills ? `<div><h3 class="text-xs font-bold uppercase text-orange-800 border-b border-orange-300 pb-1 mb-1">Skills</h3><p class="text-xs text-gray-700">${skills}</p></div>` : ''}
                            ${exp ? `<div><h3 class="text-xs font-bold uppercase text-orange-800 border-b border-orange-300 pb-1 mb-1">Experience</h3><p class="text-xs text-gray-700 whitespace-pre-line">${exp}</p></div>` : ''}
                        </div>
                    </div>`;
            } else if (template === '4') {
                // 4. Cyberpunk Cyan Tech
                previewArea.innerHTML = `
                    <div class="space-y-4 bg-slate-900 text-white p-5 rounded-xl shadow-lg">
                        <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                            <div><h2 class="text-2xl font-bold text-cyan-400">${name}</h2><p class="text-xs text-slate-300">${contactLine}</p></div>
                            <div class="w-16 h-16 rounded-lg overflow-hidden bg-slate-800 border border-cyan-400 flex items-center justify-center">${photoHTML}</div>
                        </div>
                        <div class="space-y-3 text-xs text-slate-200">
                            ${summary ? `<div><h3 class="font-bold text-cyan-400 uppercase border-b border-slate-700 pb-1 mb-1 text-[11px]">Summary</h3><p>${summary}</p></div>` : ''}
                            ${eduHTML ? `<div><h3 class="font-bold text-cyan-400 uppercase border-b border-slate-700 pb-1 mb-1 text-[11px]">Education</h3>${eduHTML}</div>` : ''}
                            ${skills ? `<div><h3 class="font-bold text-cyan-400 uppercase border-b border-slate-700 pb-1 mb-1 text-[11px]">Tech Stack</h3><p>${skills}</p></div>` : ''}
                            ${exp ? `<div><h3 class="font-bold text-cyan-400 uppercase border-b border-slate-700 pb-1 mb-1 text-[11px]">Experience</h3><p class="whitespace-pre-line">${exp}</p></div>` : ''}
                        </div>
                    </div>`;
            } else if (template === '5') {
                // 5. Royal Blue Executive
                previewArea.innerHTML = `
                    <div class="space-y-4 text-center">
                        <div class="border-b-4 border-blue-800 pb-4 flex flex-col items-center">
                            <div class="w-28 h-28 rounded-full overflow-hidden bg-blue-100 flex items-center justify-center shadow mb-2">${photoHTML}</div>
                            <h2 class="text-2xl font-black text-blue-900">${name}</h2>
                            <p class="text-xs text-gray-600 mt-1">${contactLine}</p>
                            <p class="text-[11px] text-gray-500">${personalLine}</p>
                        </div>
                        <div class="text-left space-y-3">
                            ${summary ? `<div><h3 class="text-xs font-black uppercase text-blue-900 border-b border-blue-800 pb-1 mb-1">Executive Summary</h3><p class="text-xs text-gray-700">${summary}</p></div>` : ''}
                            ${eduHTML ? `<div><h3 class="text-xs font-black uppercase text-blue-900 border-b border-blue-800 pb-1 mb-1">Education</h3>${eduHTML}</div>` : ''}
                            ${skills ? `<div><h3 class="text-xs font-black uppercase text-blue-900 border-b border-blue-800 pb-1 mb-1">Core Skills</h3><p class="text-xs text-gray-700">${skills}</p></div>` : ''}
                            ${exp ? `<div><h3 class="text-xs font-black uppercase text-blue-900 border-b border-blue-800 pb-1 mb-1">Work History</h3><p class="text-xs text-gray-700 whitespace-pre-line">${exp}</p></div>` : ''}
                        </div>
                    </div>`;
            } else if (template === '6') {
                // 6. Ruby Red Creative Split
                previewArea.innerHTML = `
                    <div class="space-y-4 border-l-8 border-rose-600 pl-4 bg-rose-50/10 p-2">
                        <div class="flex justify-between items-start border-b border-rose-200 pb-3">
                            <div><h2 class="text-2xl font-bold text-rose-900">${name}</h2><p class="text-xs text-gray-600">${contactLine}</p><p class="text-[11px] text-gray-500">${personalLine}</p></div>
                            <div class="w-24 h-24 rounded-lg overflow-hidden bg-white shadow border border-rose-300 flex items-center justify-center">${photoHTML}</div>
                        </div>
                        <div class="space-y-3">
                            ${summary ? `<div><h3 class="text-xs font-bold uppercase text-rose-800 border-b border-rose-300 pb-1 mb-1">Profile</h3><p class="text-xs text-gray-700">${summary}</p></div>` : ''}
                            ${eduHTML ? `<div><h3 class="text-xs font-bold uppercase text-rose-800 border-b border-rose-300 pb-1 mb-1">Education</h3>${eduHTML}</div>` : ''}
                            ${skills ? `<div><h3 class="text-xs font-bold uppercase text-rose-800 border-b border-rose-300 pb-1 mb-1">Skills</h3><p class="text-xs text-gray-700">${skills}</p></div>` : ''}
                            ${exp ? `<div><h3 class="text-xs font-bold uppercase text-rose-800 border-b border-rose-300 pb-1 mb-1">Experience</h3><p class="text-xs text-gray-700 whitespace-pre-line">${exp}</p></div>` : ''}
                        </div>
                    </div>`;
            } else if (template === '7') {
                // 7. Minimalist Gold & Clean
                previewArea.innerHTML = `
                    <div class="space-y-4 p-4 border border-amber-300 bg-amber-50/10 rounded-xl">
                        <div class="text-center border-b border-amber-200 pb-3">
                            <div class="w-20 h-20 mx-auto rounded-full overflow-hidden bg-gray-200 flex items-center justify-center mb-2 shadow">${photoHTML}</div>
                            <h2 class="text-2xl font-serif font-bold text-amber-900">${name}</h2>
                            <p class="text-[11px] text-gray-600">${contactLine}</p>
                        </div>
                        <div class="space-y-3 text-xs">
