<!DOCTYPE html>
<html lang="hi" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Candidate Career Hub - RozgarHub.in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>tailwind.config = { darkMode: 'class', }</script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        const app = initializeApp({
            apiKey: "AIzaSyAfbDA-3Lh8VyUg2kirKV6kTgRiFj77gxc",
            authDomain: "rozgarhub-aa22b.firebaseapp.com",
            projectId: "rozgarhub-aa22b",
            storageBucket: "rozgarhub-aa22b.firebasestorage.app",
            messagingSenderId: "979487527584",
            appId: "1:979487527584:web:43b1f8eeb07c6631f42fc5"
        });
        window.db = getFirestore(app);
        window.collection = collection;
        window.getDocs = getDocs;
        window.addDoc = addDoc;
        window.dispatchEvent(new Event('firebase-ready'));
    </script>
    <style>
        .glass-card { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(16px); }
        .dark .glass-card { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(16px); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans flex flex-col min-h-screen">
    <header class="glass-card shadow-lg sticky top-0 z-50 border-b border-slate-200 dark:border-slate-800">
        <div class="container mx-auto flex justify-between items-center p-4">
            <a href="index.html" class="text-2xl font-black text-indigo-600">RozgarHub<span class="text-amber-500">.in</span> | Candidate Hub</a>
            <div class="flex items-center space-x-3 text-sm font-bold">
                <button onclick="document.getElementById('htmlRoot').classList.toggle('dark')" class="p-2.5 rounded-2xl bg-slate-100 dark:bg-slate-900">🌙</button>
                <a href="index.html" class="px-4 py-2 rounded-2xl bg-slate-100 dark:bg-slate-900">🏠 होम</a>
                <button id="logoutBtn" onclick="localStorage.removeItem('rozgarHubCandidateUser'); location.reload();" class="hidden px-4 py-2 rounded-2xl bg-red-600 text-white">लॉग आउट</button>
            </div>
        </div>
    </header>

    <main id="authView" class="container mx-auto px-4 py-16 flex-grow flex justify-center items-center max-w-md">
        <div class="glass-card p-8 rounded-[2.5rem] shadow-2xl border w-full space-y-6 text-center">
            <h1 class="text-2xl font-black">कैंडिडेट करियर पोर्टल</h1>
            <form onsubmit="localStorage.setItem('rozgarHubCandidateUser', JSON.stringify({name: 'अमन कुमार', email: document.getElementById('lEmail').value})); alert('लॉगिन सफल!'); location.reload();" class="space-y-4 text-xs text-left">
                <div><label class="font-bold">ईमेल</label><input type="email" id="lEmail" required class="w-full border p-3.5 rounded-2xl bg-white/50 dark:bg-slate-900/50 font-bold"></div>
                <div><label class="font-bold">पासवर्ड</label><input type="password" required class="w-full border p-3.5 rounded-2xl bg-white/50 dark:bg-slate-900/50 font-bold"></div>
                <button type="submit" class="w-full py-4 rounded-2xl bg-indigo-600 text-white font-black">लॉगिन करें ⚡</button>
            </form>
        </div>
    </main>

    <main id="dashboardView" class="container mx-auto px-4 py-10 max-w-5xl flex-grow hidden space-y-8">
        <div class="rounded-[2.5rem] bg-gradient-to-br from-indigo-900 to-slate-900 text-white p-8 shadow-2xl flex justify-between items-center">
            <div>
                <h1 id="userWelcomeName" class="text-2xl font-black">नमस्ते, अमन कुमार!</h1>
                <p class="text-xs text-indigo-200">Azamgarh, UP</p>
            </div>
            <div class="glass-card p-4 rounded-3xl text-center text-slate-900 dark:text-white font-black text-xl">98% AI Match</div>
        </div>

        <div class="flex gap-3 border-b pb-4 text-xs font-bold">
            <button onclick="switchTab('applied')" id="t1" class="px-5 py-3 rounded-2xl bg-indigo-600 text-white shadow">📥 अप्लाइड जॉब्स</button>
            <button onclick="switchTab('jobs')" id="t2" class="px-5 py-3 rounded-2xl bg-white dark:bg-slate-900 border">🎯 इंस्टेंट अप्लाई</button>
        </div>

        <div id="cApplied" class="space-y-4">
            <h3 class="font-black text-sm uppercase">📋 आपके आवेदन</h3>
            <div id="appliedList" class="space-y-3"></div>
        </div>

        <div id="cJobs" class="space-y-4 hidden">
            <h3 class="font-black text-sm uppercase">🎯 लाइव कॉर्पोरेट जॉब्स</h3>
            <div id="instantList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>
    </main>

    <script>
        window.onload = () => {
            let u = JSON.parse(localStorage.getItem('rozgarHubCandidateUser'));
            if(u) {
                document.getElementById('authView').classList.add('hidden');
                document.getElementById('dashboardView').classList.remove('hidden');
                document.getElementById('logoutBtn').classList.remove('hidden');
                renderApplied();
            }
        };
        function switchTab(t) {
            document.getElementById('cApplied').classList.toggle('hidden', t !== 'applied');
            document.getElementById('cJobs').classList.toggle('hidden', t !== 'jobs');
            document.getElementById('t1').className = t === 'applied' ? "px-5 py-3 rounded-2xl bg-indigo-600 text-white font-black" : "px-5 py-3 rounded-2xl bg-white dark:bg-slate-900 border font-bold";
            document.getElementById('t2').className = t === 'jobs' ? "px-5 py-3 rounded-2xl bg-indigo-600 text-white font-black" : "px-5 py-3 rounded-2xl bg-white dark:bg-slate-900 border font-bold";
            if(t === 'jobs') loadInstantJobs();
        }
        function renderApplied() {
            let list = JSON.parse(localStorage.getItem('rozgarHubAppliedJobs')) || [{title: "Computer Operator", org: "Tech Solutions", status: "Shortlisted"}];
            let html = "";
            list.forEach(j => { html += `<div class="glass-card p-5 rounded-2xl border flex justify-between text-xs"><div><b>${j.title}</b> • ${j.org}</div><span class="px-3 py-1 bg-emerald-100 text-emerald-800 rounded-full font-bold">Status: ${j.status}</span></div>`; });
            document.getElementById('appliedList').innerHTML = html;
        }
        window.addEventListener('firebase-ready', () => {});
        async function loadInstantJobs() {
            let snap = await window.getDocs(window.collection(window.db, "jobs"));
            let html = "";
            snap.forEach(d => {
                let j = d.data();
                html += `<div class="glass-card p-5 rounded-2xl border space-y-3 text-xs">
                    <h4 class="font-black text-sm">${j.title}</h4>
                    <p class="text-slate-500">${j.company} • ${j.city} • 💰 ${j.salary}</p>
                    <button onclick="applyJob('${j.title}', '${j.company}')" class="w-full py-2.5 rounded-xl bg-indigo-600 text-white font-bold">1-क्लिक अप्लाई ⚡</button>
                </div>`;
            });
            document.getElementById('instantList').innerHTML = html || "<p class='text-xs text-slate-400'>कोई जॉब नहीं है।</p>";
        }
        function applyJob(title, org) {
            let list = JSON.parse(localStorage.getItem('rozgarHubAppliedJobs')) || [];
            if(list.some(j => j.title === title)) { alert("पहले ही आवेदन कर चुके हैं!"); return; }
            list.unshift({title, org, status: "Submitted"});
            localStorage.setItem('rozgarHubAppliedJobs', JSON.stringify(list));
            alert("सफलतापूर्वक आवेदन हो गया!");
            renderApplied();
            switchTab('applied');
        }
    </script>
</body>
</html>
